<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>🐍 Snake Game</h1>
            <div class="game-info">
                <div class="score">Score: <span id="score">0</span></div>
                <div class="high-score">High Score: <span id="high-score">0</span></div>
            </div>
        </div>
        
        <div class="game-board-container">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <div id="game-over" class="game-over hidden">
                <h2>Game Over!</h2>
                <p>Final Score: <span id="final-score">0</span></p>
                <button id="restart-btn" class="btn">Play Again</button>
            </div>
        </div>
        
        <div class="game-controls">
            <div class="control-buttons">
                <button id="start-btn" class="btn primary">Start Game</button>
                <button id="pause-btn" class="btn">Pause</button>
                <button id="reset-btn" class="btn">Reset</button>
            </div>
            
            <div class="speed-control">
                <label for="speed">Speed:</label>
                <select id="speed">
                    <option value="200">Slow</option>
                    <option value="150" selected>Normal</option>
                    <option value="100">Fast</option>
                    <option value="50">Very Fast</option>
                </select>
            </div>
        </div>
        
        <div class="instructions">
            <h3>How to Play:</h3>
            <ul>
                <li>Use arrow keys or WASD to control the snake</li>
                <li>Eat the red food to grow and increase your score</li>
                <li>Avoid hitting the walls or your own tail</li>
                <li>Try to beat your high score!</li>
            </ul>
        </div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
